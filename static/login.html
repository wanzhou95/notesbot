<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录</title>
<style>
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7f9;display:flex;align-items:center;justify-content:center;height:100vh}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px;width:320px}
h2{margin:0 0 16px;font-size:18px}
input{width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:11px;font-size:15px;margin-bottom:10px;box-sizing:border-box}
button{width:100%;background:#4f46e5;color:#fff;border:0;border-radius:10px;padding:11px;font-size:15px;font-weight:600;cursor:pointer}
.err{color:#dc2626;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h2>登录知识库</h2>
<input id="u" placeholder="用户名">
<input id="p" type="password" placeholder="密码">
<button onclick="login()">登录</button>
<div id="e" class="err"></div>
</div>
<script>
window.login = function(){
  var u = document.getElementById('u').value.trim();
  var p = document.getElementById('p').value;
  fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user:u, pass:p})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.ok){ location.reload(); }
      else{ document.getElementById('e').textContent = d.err || '登录失败'; }
    });
};
</script>
</body>
</html>
