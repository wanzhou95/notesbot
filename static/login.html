<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录</title>
<style>
body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7f9;display:flex;align-items:center;justify-content:center;height:100vh;position:relative}
.foot{position:absolute;bottom:18px;left:0;right:0;padding:0 16px;text-align:center;font-size:12px;line-height:1.9;color:#9ca3af}
.foot a{color:#6b7280;text-decoration:none;word-break:break-all}
.foot a:hover{color:#4f46e5;text-decoration:underline}
.foot .sep{margin:0 7px;color:#d1d5db;user-select:none}
.foot img{width:14px;height:14px;vertical-align:-2px;margin-right:3px}
@media (max-width:420px){.foot{font-size:11px}}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:24px;width:320px}
h2{margin:0 0 16px;font-size:18px}
input{width:100%;border:1px solid #e5e7eb;border-radius:10px;padding:11px;font-size:15px;margin-bottom:10px;box-sizing:border-box}
button{width:100%;background:#4f46e5;color:#fff;border:0;border-radius:10px;padding:11px;font-size:15px;font-weight:600;cursor:pointer}
.err{color:#dc2626;font-size:13px;margin-top:8px}
</style>
</head>
<body>
<div class="card">
<h2>登录知识库</h2>
<input id="u" placeholder="用户名">
<input id="p" type="password" placeholder="密码">
<button onclick="login()">登录</button>
<div id="e" class="err"></div>
</div>
<footer class="foot">
<a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">闽ICP备2026018624号-2</a>
<span class="sep" aria-hidden="true">·</span>
<a href="https://beian.mps.gov.cn/#/query/webSearch?code=35092102000227" target="_blank" rel="noreferrer"><img src="/beian-ico" alt="" width="14" height="14" onerror="this.remove()">闽公网安备35092102000227号</a>
</footer>
<script>
window.login = function(){
  var u = document.getElementById('u').value.trim();
  var p = document.getElementById('p').value;
  fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user:u, pass:p})})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.ok){ location.reload(); }
      else{ document.getElementById('e').textContent = d.err || '登录失败'; }
    });
};
</script>
</body>
</html>
